<style>
:root{--bg:#F4F6FA;--card:#fff;--line:#E5E9F0;--main:#111827;--sub:#4B5563;--weak:#9CA3AF;
      --blue:#1D4ED8;--soft:#EFF6FF;--green:#047857;--orange:#C2410C;--red:#B91C1C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--main);font-size:14px;padding-bottom:70px;overflow-x:hidden}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#1D4ED8,#3B82F6);
       color:#fff;padding:12px 16px}
header h1{margin:0;font-size:16px;font-weight:800}
header .s{font-size:11px;opacity:.85;margin-top:2px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:19}
.tab{flex:1;text-align:center;padding:11px 0;font-size:13px;color:var(--sub)}
.tab.on{color:var(--blue);font-weight:700;border-bottom:2px solid var(--blue)}
.pane{display:none;padding:12px}
.pane.on{display:block}
.filters{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12.5px;
      color:var(--sub);background:#fff;white-space:nowrap}
.chip.on{background:var(--soft);border-color:#93C5FD;color:var(--blue);font-weight:700}
input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;
             background:#fff;color:var(--main);font-family:inherit;outline:none;margin-top:9px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.row{display:flex;gap:9px;align-items:flex-start}
.nm{font-size:15px;font-weight:800;line-height:1.35;flex:1;word-break:break-all}
.sc{flex:0 0 auto;width:46px;height:46px;border-radius:50%;color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:15px}
.sc.a{background:linear-gradient(135deg,#10B981,#059669)}
.sc.b{background:linear-gradient(135deg,#F59E0B,#D97706)}
.sc.c{background:linear-gradient(135deg,#94A3B8,#64748B)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;border-radius:6px;padding:2px 7px;border:1px solid var(--line);color:var(--sub);background:#FAFBFD}
.tag.b{background:var(--soft);border-color:#BFDBFE;color:var(--blue)}
.tag.g{background:#ECFDF5;border-color:#A7F3D0;color:var(--green)}
.tag.o{background:#FFF7ED;border-color:#FED7AA;color:var(--orange)}
.ct{margin-top:9px;display:flex;flex-wrap:wrap;gap:7px}
.ct a{text-decoration:none;font-size:12.5px;padding:8px 11px;border-radius:9px;background:var(--soft);
      color:var(--blue);font-weight:600}
.ct a.m{background:#F0FDF4;color:var(--green)}
.btn{border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;background:var(--blue);
     color:#fff;font-family:inherit}
.btn.gh{background:#fff;color:var(--sub);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:6px 11px;font-size:12px}
.addr{margin-top:7px;font-size:11.5px;color:var(--weak);line-height:1.5}
.empty{text-align:center;color:var(--weak);padding:36px 0;font-size:13px}
.kv{display:grid;grid-template-columns:74px 1fr;gap:6px 10px;font-size:12.5px;margin-top:8px}
.kv .k{color:var(--weak)} .kv .v{word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:7px 5px;border-bottom:1px solid #EEF2F7;vertical-align:top}
th{color:var(--weak);font-weight:600;background:#FAFBFD}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
     display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:8px;z-index:30}
.bar .tab2{flex:1;text-align:center;font-size:12px;color:var(--weak);padding:5px 0}
.bar .tab2.on{color:var(--blue);font-weight:700}
.bar .tab2 b{display:block;font-size:17px;font-weight:400}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:#111827;
       color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:.25s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.note{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:10px 12px;font-size:12px;
      color:#92400E;line-height:1.6;margin-top:10px}
.mask{position:fixed;inset:0;background:rgba(15,27,45,.55);display:none;align-items:flex-end;z-index:60}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.sheet h3{margin:0 0 10px;font-size:15px}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
function scoreCls(n){return n>=70?'a':n>=50?'b':'c';}

/* ---------- 客户池（本地存储） ---------- */
const KEY='ru_radar_pool_v1';
function getPool(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function savePool(p){localStorage.setItem(KEY,JSON.stringify(p));renderPoolNum();}
function renderPoolNum(){const n=Object.keys(getPool()).length;$('#poolNum').textContent=n?' '+n:'';}

/* ---------- 切换 ---------- */
document.querySelectorAll('.tab,.tab2').forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll('.tab,.tab2').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.tab[data-p="'+el.dataset.p+'"]').forEach(x=>x.classList.add('on'));
    document.querySelectorAll('.tab2[data-p="'+el.dataset.p+'"]').forEach(x=>x.classList.add('on'));
    document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
    $('#p-'+el.dataset.p).classList.add('on');
    if(el.dataset.p==='pool') renderPool();
    window.scrollTo(0,0);
  };
});

/* ---------- 俄罗斯客商 ---------- */
let ruFilter={q:'',city:'',ind:''};
const cities=[...new Set(DATA.ru.map(c=>c.city))];
$('#city').innerHTML='<option value="">全部城市</option>'+cities.map(c=>`<option>${esc(c)}</option>`).join('');
const inds=[...new Set(DATA.ru.map(c=>c.ind))];
$('#indChips').innerHTML=inds.map(i=>`<span class="chip" data-i="${esc(i)}">${esc(i)}</span>`).join('');
$('#indChips').onclick=e=>{
  const c=e.target.closest('.chip'); if(!c)return;
  const on=c.classList.contains('on');
  document.querySelectorAll('#indChips .chip').forEach(x=>x.classList.remove('on'));
  if(!on){c.classList.add('on');ruFilter.ind=c.dataset.i;}else ruFilter.ind='';
  renderRu();
};
$('#q').oninput=()=>{ruFilter.q=$('#q').value.trim().toLowerCase();renderRu();};
$('#city').onchange=()=>{ruFilter.city=$('#city').value;renderRu();};

function renderRu(){
  const list=DATA.ru.filter(c=>{
    if(ruFilter.city&&c.city!==ruFilter.city)return false;
    if(ruFilter.ind&&c.ind!==ruFilter.ind)return false;
    if(ruFilter.q){
      const hay=(c.ru+c.cn+c.en+c.prod+c.sup+c.inn).toLowerCase();
      if(!hay.includes(ruFilter.q))return false;
    }
    return true;
  }).sort((a,b)=>b.score-a.score);
  $('#ruList').innerHTML=list.length?list.map(c=>`
    <div class="card">
      <div class="row">
        <div class="nm">${esc(c.ru)}</div>
        <div class="sc ${scoreCls(c.score)}">${c.score}</div>
      </div>
      <div class="tags">
        <span class="tag b">${esc(c.city)}</span>
        <span class="tag">${esc(c.ind)}</span>
        ${c.real?'<span class="tag g">有进口记录</span>':''}
      </div>
      <div class="ct">
        ${c.tel?`<a href="tel:${esc(c.tel)}">📞 ${esc(c.tel)}</a>`:''}
        ${c.mail?`<a class="m" href="mailto:${esc(c.mail)}">✉️ ${esc(c.mail)}</a>`:''}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn sm" onclick="openRu('${c.id}')">看采购记录</button>
        <button class="btn sm gh" onclick="addPoolRu('${c.id}')">加入客户池</button>
      </div>
    </div>`).join(''):'<div class="empty">没有匹配的客商</div>';
}

function openRu(id){
  const c=DATA.ru.find(x=>x.id===id); if(!c)return;
  const recs=c.rec.length?`<table><tr><th>日期</th><th>HS</th><th>出口商</th></tr>
    ${c.rec.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.hs)}</td><td>${esc(r.exporter)}<br><span style="color:var(--weak)">${esc(r.product)}</span></td></tr>`).join('')}</table>`
    :'<div class="empty" style="padding:16px 0">暂无已接入的报关记录</div>';
  const tl=c.tl.map(t=>`<div style="font-size:12px;color:var(--sub);padding:5px 0;border-bottom:1px dashed #EEF2F7">
    <span style="color:var(--weak)">${esc(t.date)}</span> ${esc(t.text)}</div>`).join('');
  $('#sheet').innerHTML=`
    <h3>${esc(c.ru)}</h3>
    <div class="kv">
      <div class="k">中文名</div><div class="v">${esc(c.cn)}</div>
      <div class="k">税号</div><div class="v">${esc(c.inn)}</div>
      <div class="k">城市</div><div class="v">${esc(c.city)}</div>
      <div class="k">官网</div><div class="v">${esc(c.web)}</div>
      <div class="k">电话</div><div class="v">${esc(c.tel)}</div>
      <div class="k">邮箱</div><div class="v">${esc(c.mail)}</div>
      <div class="k">采购品类</div><div class="v">${esc(c.prod)}</div>
      <div class="k">供应商线索</div><div class="v">${esc(c.sup)}</div>
    </div>
    <h3 style="margin-top:14px">从中国进口记录</h3>${recs}
    <h3 style="margin-top:14px">信号时间线</h3>${tl}
    <div class="note">数据说明：进口记录为中国出口侧镜像；评分由公开信号综合计算，仅供参考。</div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn" style="flex:1" onclick="addPoolRu('${c.id}');closeSheet()">加入客户池</button>
      <button class="btn gh" style="flex:1" onclick="closeSheet()">关闭</button>
    </div>`;
  $('#mask').classList.add('on');
}
function closeSheet(){$('#mask').classList.remove('on');}
$('#mask').onclick=e=>{if(e.target.id==='mask')closeSheet();};

function addPoolRu(id){
  const c=DATA.ru.find(x=>x.id===id); if(!c)return;
  const p=getPool();
  if(!p['ru:'+id]) p['ru:'+id]={type:'ru',name:c.cn,ru:c.ru,tel:c.tel,mail:c.mail,
    stage:'新线索',note:'',follows:[],ts:Date.now()};
  savePool(p); toast('已加入客户池'); renderPool();
}

/* ---------- 黑河公司 ---------- */
let hq='',hcat='';
$('#hq').oninput=()=>{hq=$('#hq').value.trim().toLowerCase();renderHei();};
$('#hcat').onchange=()=>{hcat=$('#hcat').value;renderHei();};
function renderHei(){
  const list=DATA.heihe.filter(c=>{
    if(hcat&&c.k!==hcat)return false;
    if(hq){const hay=(c.n+c.l+c.a).toLowerCase();if(!hay.includes(hq))return false;}
    return true;
  }).slice(0,150);
  $('#heiList').innerHTML=`<div style="font-size:12px;color:var(--weak);padding:0 2px 8px">共 ${DATA.heihe.length} 家，显示前 ${list.length} 家</div>`+
  list.map(c=>`
    <div class="card">
      <div class="nm">${esc(c.n)}</div>
      <div class="tags">
        <span class="tag b">${esc(c.d||'—')}</span>
        <span class="tag">${esc(c.k)}</span>
        ${c.s?`<span class="tag g">${esc(c.s)}</span>`:''}
      </div>
      <div class="ct">
        ${c.p&&c.p.split(' / ')[0]?`<a href="tel:${esc(c.p.split(' / ')[0])}">📞 ${esc(c.p.split(' / ')[0])}</a>`:''}
        ${c.e&&c.e.split(' / ')[0]?`<a class="m" href="mailto:${esc(c.e.split(' / ')[0])}">✉️ ${esc(c.e.split(' / ')[0])}</a>`:''}
      </div>
      <div class="addr">${esc(c.a)}</div>
      <div style="margin-top:9px"><button class="btn sm gh" onclick="addPoolHei('${esc(c.n).replace(/'/g,'')}')">加入客户池</button></div>
    </div>`).join('');
}
function addPoolHei(name){
  const c=DATA.heihe.find(x=>x.n===name);
  const p=getPool(); const k='he:'+name;
  if(!p[k]) p[k]={type:'hei',name:name,tel:c?c.p:'',mail:c?c.e:'',stage:'新线索',note:'',follows:[],ts:Date.now()};
  savePool(p); toast('已加入客户池'); renderPool();
}

/* ---------- 客户池 ---------- */
function renderPool(){
  const p=getPool(); const arr=Object.values(p).sort((a,b)=>b.ts-a.ts);
  if(!arr.length){$('#poolList').innerHTML='<div class="empty">还没有客户，去前面两个页签挑几家</div>';renderPoolNum();return;}
  $('#poolList').innerHTML=arr.map(c=>`
    <div class="card">
      <div class="row">
        <div class="nm">${esc(c.name)}</div>
        <div class="tag ${c.stage==='已成交'?'g':'o'}">${esc(c.stage)}</div>
      </div>
      ${c.ru?`<div class="addr">${esc(c.ru)}</div>`:''}
      <div class="ct">
        ${c.tel?`<a href="tel:${esc(c.tel)}">📞</a>`:''}
        ${c.mail?`<a class="m" href="mailto:${esc(c.mail)}">✉️</a>`:''}
      </div>
      ${c.follows.length?`<div class="addr">最近：${esc(c.follows[c.follows.length-1].txt)}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:9px">
        <button class="btn sm" onclick="followUp('${esc(c.name).replace(/'/g,'')}')">记跟进</button>
        <button class="btn sm gh" onclick="nextStage('${esc(c.name).replace(/'/g,'')}')">下一阶段</button>
      </div>
    </div>`).join('');
  renderPoolNum();
}
const STAGES=['新线索','已触达','洽谈中','已报价','已成交','已流失'];
function findKey(name){const p=getPool();return Object.keys(p).find(k=>p[k].name===name);}
function nextStage(name){
  const p=getPool(); const k=findKey(name); if(!k)return;
  const i=STAGES.indexOf(p[k].stage);
  p[k].stage=STAGES[(i+1)%STAGES.length];
  savePool(p); renderPool(); toast('已改为 '+p[k].stage);
}
function followUp(name){
  const p=getPool(); const k=findKey(name); if(!k)return;
  const txt=prompt('记录本次沟通（电话/微信/上门）：');
  if(!txt)return;
  p[k].follows.push({txt:txt,ts:Date.now()});
  if(p[k].stage==='新线索')p[k].stage='已触达';
  savePool(p); renderPool(); toast('已记录');
}
function exportPool(){
  const p=getPool();
  let csv='\ufeff名称,俄文名,电话,邮箱,阶段,跟进记录\n';
  Object.values(p).forEach(c=>{
    const f=(c.follows||[]).map(x=>x.txt).join(' / ');
    csv+=`"${c.name}","${c.ru||''}","${c.tel||''}","${c.mail||''}","${c.stage}","${f}"\n`;
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='客户池.csv'; a.click();
  toast('已导出');
}
function clearPool(){
  if(!confirm('确认清空客户池？'))return;
  localStorage.removeItem(KEY); renderPool(); toast('已清空');
}

renderRu(); renderHei(); renderPoolNum();
</script>
</body>
</html>
